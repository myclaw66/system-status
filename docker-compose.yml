version: '3.8'

services:
  system-status:
    build: .
    container_name: system-status
    restart: unless-stopped
    privileged: true        # 需要读取 /proc /sys
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./data:/data
    env_file:
      - .env
    ports:
      # 8888 是为了避开宿主机上 cadence-rocky:final 已占用的 8080
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
